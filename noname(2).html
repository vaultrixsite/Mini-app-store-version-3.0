<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Perfect Fit Puzzle Game with Ads</title>
<style>
* { box-sizing: border-box; user-select: none; }
body {
margin: 0; padding: 0; width: 100vw; height: 100vh;
background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); color: #fff;
display: flex; flex-direction: column; align-items: center; justify-content: space-between;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden;
}
/* Top Ad Container */
.ad-top {
width: 100%; max-width: 360px; min-height: 50px;
display: flex; justify-content: center; align-items: center;
background: rgba(0,0,0,0.4); margin-top: 4px; border-radius: 8px;
}
/* Game Layout Container */
.game-container {
width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; padding: 4px; flex-grow: 1; justify-content: center;
}
#game-header {
display: flex; justify-content: space-between; width: 100%; padding: 8px 12px; background: rgba(0,0,0,0.7); font-size: 0.9rem; font-weight: bold; border-radius: 8px 8px 0 0; border: 1px solid rgba(255,255,255,0.1); border-bottom: none;
}
.board-container {
position: relative; width: 100%; aspect-ratio: 1/1; background: rgba(0,0,0,0.85);
display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr);
gap: 6px; padding: 8px; border-radius: 0 0 8px 8px; border: 1px solid rgba(255,255,255,0.1);
box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}
.tile {
background: rgba(255, 255, 255, 0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: bold; color: #fff; transition: all 0.1s ease;
}
.tile-2 { background: #34495e; color: #f1c40f; }
.tile-4 { background: #2c3e50; color: #e67e22; }
.tile-8 { background: #d35400; color: #fff; }
.tile-16 { background: #e74c3c; color: #fff; }
.tile-32 { background: #c0392b; color: #fff; }
.tile-64 { background: #8e44ad; color: #fff; }

.overlay {
position: absolute; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(15, 12, 41, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border-radius: 8px; text-align: center; padding: 15px;
}
.overlay h2 { font-size: 1.3rem; margin-bottom: 5px; color: #f1c40f; }
.overlay p { font-size: 0.8rem; color: #ccc; margin-bottom: 15px; }
.btn { background: linear-gradient(45deg, #f12711, #f5af19); color: white; border: none; padding: 8px 20px; font-size: 0.9rem; font-weight: bold; border-radius: 20px; cursor: pointer; }
.hidden { display: none !important; }

/* Bottom Ad Container */
.ad-bottom {
width: 100%; max-width: 360px; min-height: 60px;
display: flex; justify-content: center; align-items: center;
background: rgba(0,0,0,0.4); margin-bottom: 4px; border-radius: 8px;
overflow: hidden;
}
</style>
</head>
<body>

<!-- 1. SOCIAL BAR AD -->
<script src="https://pl31539155.profitableratecpmnetwork.com/5a/71/23/5a7123ffb8257c55f6710c10884def55.js"></script>

<!-- 2. TOP BANNER AD -->
<div class="ad-top">
<script>
atOptions = {
'key' : '2d64ab87de77d08d8a4b7e73d658f5de',
'format' : 'iframe',
'height' : 50,
'width' : 320,
'params' : {}
};
</script>
<script src="https://www.highrevenueformat.com/2d64ab87de77d08d8a4b7e73d658f5de/invoke.js"></script>
</div>

<!-- GAME CONTAINER -->
<div class="game-container">
<div id="game-header">
<span id="scoreText">Score: 0</span>
<span id="bestText">Best: 0</span>
</div>
<div style="position: relative; width: 100%;">
<div id="mainOverlay" class="overlay">
<h2>SLIDE PUZZLE</h2>
<p>Swipe Up, Down, Left or Right to merge matching numbers and make a high score!</p>
<button class="btn" id="startBtn">START GAME</button>
</div>
<div id="board" class="board-container"></div>
</div>
</div>

<!-- 3. BOTTOM NATIVE BANNER AD (FIXED CONTAINER) -->
<div class="ad-bottom">
<script async="async" data-cfasync="false" src="https://pl31539143.profitableratecpmnetwork.com/55746ba7485caf30b218505cb537bed7/invoke.js"></script>
<div id="container-55746ba7485caf30b218505cb537bed7"></div>
</div>

<script>
const size = 4;
let board = [];
let score = 0, best = 0;

const boardEl = document.getElementById("board");
const overlay = document.getElementById("mainOverlay");
const startBtn = document.getElementById("startBtn");
const scoreText = document.getElementById("scoreText");
const bestText = document.getElementById("bestText");

startBtn.onclick = () => { overlay.classList.add("hidden"); initGame(); };

function initGame() {
board = Array(size).fill(0).map(() => Array(size).fill(0));
score = 0;
addNewTile();
addNewTile();
updateView();
}

function addNewTile() {
let empty = [];
for(let r=0; r<size; r++) {
for(let c=0; c<size; c++) {
if(board[r][c] === 0) empty.push({r, c});
}
}
if(empty.length > 0) {
let {r, c} = empty[Math.floor(Math.random() * empty.length)];
board[r][c] = Math.random() < 0.9 ? 2 : 4;
}
}

function updateView() {
boardEl.innerHTML = "";
for(let r=0; r<size; r++) {
for(let c=0; c<size; c++) {
let val = board[r][c];
let tile = document.createElement("div");
tile.className = "tile" + (val > 0 ? " tile-" + val : "");
tile.innerText = val > 0 ? val : "";
boardEl.appendChild(tile);
}
}
scoreText.innerText = "Score: " + score;
if(score > best) best = score;
bestText.innerText = "Best: " + best;
}

// Touch controls for sliding
let startX = 0, startY = 0;
boardEl.addEventListener("touchstart", e => {
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
}, {passive: true});

boardEl.addEventListener("touchend", e => {
let dx = e.changedTouches[0].clientX - startX;
let dy = e.changedTouches[0].clientY - startY;

if(Math.abs(dx) > Math.abs(dy)) {
if(Math.abs(dx) > 20) {
if(dx > 0) moveRight();
else moveLeft();
}
} else {
if(Math.abs(dy) > 20) {
if(dy > 0) moveDown();
else moveUp();
}
}
}, {passive: true});

function slide(row) {
let arr = row.filter(v => v);
for(let i=0; i<arr.length-1; i++) {
if(arr[i] === arr[i+1]) {
arr[i] *= 2;
score += arr[i];
arr[i+1] = 0;
}
}
arr = arr.filter(v => v);
while(arr.length < size) arr.push(0);
return arr;
}

function moveLeft() {
let moved = false;
for(let r=0; r<size; r++) {
let original = [...board[r]];
board[r] = slide(board[r]);
if(board[r].toString() !== original.toString()) moved = true;
}
if(moved) { addNewTile(); updateView(); checkGameOver(); }
}

function moveRight() {
let moved = false;
for(let r=0; r<size; r++) {
let original = [...board[r]];
let rev = [...board[r]].reverse();
rev = slide(rev);
board[r] = rev.reverse();
if(board[r].toString() !== original.toString()) moved = true;
}
if(moved) { addNewTile(); updateView(); checkGameOver(); }
}

function moveUp() {
let moved = false;
for(let c=0; c<size; c++) {
let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
let original = [...col];
col = slide(col);
for(let r=0; r<size; r++) {
if(board[r][c] !== col[r]) moved = true;
board[r][c] = col[r];
}
}
if(moved) { addNewTile(); updateView(); checkGameOver(); }
}

function moveDown() {
let moved = false;
for(let c=0; c<size; c++) {
let col = [board[0][c], board[1][c], board[2][c], board[3][c]];
let original = [...col];
col.reverse();
col = slide(col);
col.reverse();
for(let r=0; r<size; r++) {
if(board[r][c] !== col[r]) moved = true;
board[r][c] = col[r];
}
}
if(moved) { addNewTile(); updateView(); checkGameOver(); }
}

function checkGameOver() {
let hasEmpty = false;
for(let r=0; r<size; r++) {
for(let c=0; c<size; c++) {
if(board[r][c] === 0) hasEmpty = true;
}
}
if(!hasEmpty) {
overlay.classList.remove("hidden");
overlay.querySelector("h2").innerText = "GAME OVER";
overlay.querySelector("p").innerText = "Final Score: " + score;
startBtn.innerText = "PLAY AGAIN";
}
}
</script>
</body>
</html>
